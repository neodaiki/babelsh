name: Release to PyPI

# Publishes when a version tag is pushed (e.g. v0.1.0a1). Uses PyPI "trusted publishing"
# (OIDC): there is no API token anywhere. One-time setup on PyPI -> Account -> Publishing:
#   PyPI project name: babelsh | Owner: neodaiki | Repository: babelsh
#   Workflow name: release.yml | Environment name: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          VERSION=$(python -c "import re,sys; print(re.search(r'__version__ = \"([^\"]+)\"', open('babelsh/_version.py').read()).group(1))")
          echo "package version: $VERSION, tag: $GITHUB_REF_NAME"
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Tests
        run: |
          python -m pip install pyyaml cryptography build twine
          python -m unittest discover -s tests
          python tests/run_golden.py

      - name: Build and check
        run: |
          python -m build
          python -m twine check dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
